role: Nurse Researcher | Health Workforce Wellbeing
bio: >
  I am a nurse researcher working on health workforce wellbeing, including nursing stress,
  resilience, burnout and migration. I combine psychometrics and mixed methods with institutional
  ethnography, implementation science, process evaluation and nursing philosophy. I currently work
  across Charité – Universitätsmedizin Berlin and Edinburgh Napier University. In January 2027,
  I will join the University of Manchester as Lecturer in Health Workforce, while maintaining
  close research ties with Charité.
